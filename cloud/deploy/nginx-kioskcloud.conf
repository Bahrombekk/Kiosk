# KioskCloud — nginx reverse proxy.
#
#   cp deploy/nginx-kioskcloud.conf /etc/nginx/sites-available/kioskcloud
#   ln -s /etc/nginx/sites-available/kioskcloud /etc/nginx/sites-enabled/
#   nano ...   # server_name ni o'z domeningizga almashtiring
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d cloud.poyezd.uz      # HTTPS (avtomatik yangilanadi)
#
# Bu ilova uchun MUHIM uchta narsa quyida izohlangan: WebSocket (agentlar),
# katta yuklash (8 GB) va uzoq yuklab olish (poyezdlar sekin SIM bilan tortadi).

# `Connection` sarlavhasi: WebSocket bo'lsa "upgrade", oddiy so'rovda bo'sh.
# DIQQAT: bu `map` http{} kontekstida BIR MARTA bo'lishi kerak. Agar boshqa
# saytда allaqachon shunday map bo'lsa, quyidagi 4 qatorni olib tashlang
# (nginx "duplicate map" xatosi beradi).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cloud.poyezd.uz;          # <-- O'Z DOMENINGIZ

    # certbot HTTPS'ni shu blokka o'zi qo'shadi va 80 -> 443 yo'naltiradi.

    # 1) KATTA YUKLASH: kino 8 GB bo'lishi mumkin.
    client_max_body_size 8G;
    # Buferlashni O'CHIRAMIZ — aks holda nginx butun faylni avval o'z diskiga
    # yozib, keyin uzatadi (ikki barobar disk va kutish). Bulut yuklashni oqim
    # bilan qabul qiladi, shuning uchun to'g'ridan-to'g'ri uzatamiz.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        # 2) WEBSOCKET: poyezd serverlari /agent kanalini doimiy ochiq tutadi.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 3) UZOQ ULANISHLAR: WS soatlab ochiq turadi, katta faylni sekin
        #    internetда tortish ham uzoq davom etadi.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_connect_timeout 60s;

        # Yuklab olishда nginx buferlamasin (Range bilan oqim ketadi)
        proxy_buffering off;
    }
}
