name: CI

# Har push va PR'da kodni tekshiradi: sintaksis, import, (ixtiyoriy) lint.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile all Python (syntax check)
        run: python -m compileall -q backend

      - name: Import smoke test (app modullari yuklanadimi)
        # main.py __main__ guard bilan — import qilinganda server ko'tarilmaydi,
        # faqat FastAPI app quriladi. Barcha modul importi tekshiriladi.
        working-directory: backend
        run: |
          python -c "import config, db, storage, security, relay, main; print('OK: barcha modullar yuklandi')"

      - name: Ruff lint (ixtiyoriy — buzmasin)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check . || true

  web-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Panel JS sintaksisi (web/app.js)
        run: node --check web/app.js
